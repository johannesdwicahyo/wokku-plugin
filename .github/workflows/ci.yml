name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  openapi-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: 3.4.3
      - run: ruby script/openapi_coverage.rb --self-test
      - run: ruby -Itest -e 'Dir["test/*_test.rb"].each { |f| require_relative f }'
      - run: ruby script/openapi_coverage.rb https://wokku.cloud/api/v1/openapi.yaml "plugins/wokku/mcp/*.rb" --gate
